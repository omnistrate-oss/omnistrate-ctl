# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Deploy documentation
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        type: environment
        default: "Prod"
        required: true
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy documentation
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    concurrency: deploy-documentation-${{ inputs.environment }}
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use docs-specific dockerignore
        run: cp build/Dockerfile.docs.dockerignore .dockerignore

      - name: Setup flyctl
        timeout-minutes: 5
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: Deploy to Fly
        timeout-minutes: 30
        run: flyctl deploy --config fly.docs.toml --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
